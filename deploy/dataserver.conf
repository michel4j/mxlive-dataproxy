ServerName "${SERVER_NAME}"

# Explicitly load required modules for Debian
<IfModule !mod_wsgi.c>
    LoadModule wsgi_module /usr/lib/apache2/modules/mod_wsgi.so
</IfModule>
<IfModule !mod_xsendfile.c>
    LoadModule xsendfile_module /usr/lib/apache2/modules/mod_xsendfile.so
</IfModule>

<VirtualHost *:80>

    XSendFile On
    XSendFilePath /users
    XSendFilePath /archive
    XSendFilePath /cache

    <Directory /dataserver/dataserver>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Core paths pointing to standalone /venv
    WSGIDaemonProcess dataserver python-home=/venv python-path=/dataserver
    WSGIProcessGroup dataserver
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /dataserver/dataserver/wsgi.py

    # Point back to the core container log handlers (stdout/stderr)
    LogFormat "%h (%{X-Forwarded-For}i) %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-agent}i\"" combined_with_forwarded_for

    # Send logs directly to Apache's standard streams so Docker capturing works natively
    CustomLog /var/log/apache2/access.log combined_with_forwarded_for
    ErrorLog  /var/log/apache2/error.log

    # Keep Legacy client handling fallback rule intact
    SetEnvIf User-Agent ".*MSIE.*" \
             nokeepalive ssl-unclean-shutdown \
             downgrade-1.0 force-response-1.0

</VirtualHost>
